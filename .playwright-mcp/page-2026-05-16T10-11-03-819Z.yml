            - paragraph [ref=e195]: 步骤 s2 是 define 阶段：给出氧化还原反应的核心定义：从得失氧到电子转移，再到氧化数（化合价）变化。 我需要讲解氧化还原反应概念的三个历史层次，让学生（老师）理解这个概念的演变过程，这样他在教学时可以帮助学生建立起清晰的认知链条。 让我好好组织这个讲解。 氧化还原反应的定义经历了三个层次的发展： 1. **最初的得失氧定义**（初中化学）：得氧是氧化，失氧是还原。例如：CuO + H₂ → Cu + H₂O，CuO 失去氧被还原，H₂ 得到氧被氧化。 2. **电子转移定义**（高中化学核心）：失去电子是氧化，得到电子是还原。这个定义把氧化还原反应从有氧参与的反应扩展到了所有涉及电子转移的反应。 3. **氧化数（化合价）定义**（最广泛适用）：氧化数升高是氧化，氧化数降低是还原。这个定义可以涵盖共价化合物，因为用氧化数代替了实际的电子转移。 关键逻辑链： - 化合价升高 → 失去电子 → 被氧化 → 该物质是还原剂 - 化合价降低 → 得到电子 → 被还原 → 该物质是氧化剂 口诀：升失氧、降得还（化合价升高→失电子→被氧化；化合价降低→得电子→被还原） 这正好可以对接学生之前的痛点：氧化剂/还原剂方向搞反的问题。我需要在讲解中强调这个逻辑链。 现在来写完整的讲解。
