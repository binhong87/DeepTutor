          - generic [ref=e2230]: "Q1: (a) Ionic — K is a metal, F is a non-metal, so K transfers its one valence electron to F, forming K⁺ and F⁻ ions held by electrostatic attraction. (b) Covalent — N and N are both non-metals, so they share electrons; in fact they share 3 pairs forming a triple bond N≡N. (c) Metallic — Ag atoms are all metals, so their valence electrons delocalise into a shared electron sea around Ag⁺ ion cores. Q2: Ionic bonding. The high melting point (801 °C) and inability to conduct as a solid (ions locked in lattice, can't move) but conductivity when molten (ions freed to carry charge) are the classic ionic fingerprint. This sounds exactly like NaCl. Q3: Metallic bonding. The electron sea is non-directional — when gold is hammered, the layers of Au⁺ ions slide past each other and the delocalised electrons instantly reform around the new positions, so the bond doesn't break. That's why metals are malleable and ductile."
